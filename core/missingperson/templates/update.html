<!DOCTYPE html>
<html>

<head>

<title>Update Missing Person</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

.container {
margin-top: 40px;
}

.card {
padding: 25px;
box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark"
style="background-color:#37517E;">

<div class="container-fluid">

<a class="navbar-brand" href="/">

<h3>TraceNEX</h3>

</a>

</div>

</nav>


<div class="container">

<div class="card">

<h3>Update Missing Person</h3>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="row">

<div class="col">

<label>First Name</label>

<input type="text"
name="first_name"
class="form-control"
value="{{ person.first_name }}"
required>

</div>

<div class="col">

<label>Last Name</label>

<input type="text"
name="last_name"
class="form-control"
value="{{ person.last_name }}"
required>

</div>

</div>


<div class="mt-3">

<label>Father Name</label>

<input type="text"
name="father_name"
class="form-control"
value="{{ person.father_name }}"
required>

</div>


<div class="row mt-3">

<div class="col">

<label>Date of Birth</label>

<input type="date"
name="date_of_birth"
class="form-control"
value="{{ person.date_of_birth }}"
required>

</div>

<div class="col">

<label>Missing Date</label>

<input type="date"
name="missing_from"
class="form-control"
value="{{ person.missing_from }}"
required>

</div>

</div>


<div class="mt-3">

<label>Address</label>

<input type="text"
name="address"
class="form-control"
value="{{ person.address }}"
required>

</div>


<div class="row mt-3">

<div class="col">

<label>Email</label>

<input type="email"
name="email"
class="form-control"
value="{{ person.email }}"
required>

</div>

<div class="col">

<label>Phone Number</label>

<input type="text"
name="phone_number"
class="form-control"
value="{{ person.phone_number }}"
required>

</div>

</div>


<div class="mt-3">

<label>Aadhar Number</label>

<input type="text"
name="aadhar_number"
class="form-control"
value="{{ person.aadhar_number }}"
required>

</div>


<div class="mt-3">

<label>Gender</label>

<select name="gender"
class="form-control">

<option {% if person.gender == "Male" %}selected{% endif %}>Male</option>

<option {% if person.gender == "Female" %}selected{% endif %}>Female</option>

<option {% if person.gender == "Others" %}selected{% endif %}>Others</option>

</select>

</div>


<div class="mt-3">

<label>Update Image (optional)</label>

<input type="file"
name="image"
class="form-control">

</div>


<div class="mt-4">

<button type="submit"
class="btn btn-success">

Update Person

</button>

<a href="/missing/"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</body>

</html>
