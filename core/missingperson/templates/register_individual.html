<!DOCTYPE html>
<html>

<head>

<title>Individual Report</title>

<style>

body {

font-family: Arial;

background: #f5f5f5;

padding: 30px;

}

.container {

background: white;

padding: 30px;

border-radius: 10px;

width: 600px;

margin: auto;

box-shadow: 0px 0px 10px rgba(0,0,0,0.1);

}

h2 {

text-align: center;

color: #2c3e50;

margin-bottom: 20px;

}

label {

font-weight: bold;

margin-top: 12px;

display: block;

color: #34495e;

}

input, select {

width: 100%;

padding: 10px;

margin-top: 5px;

border-radius: 5px;

border: 1px solid #ccc;

}

button {

margin-top: 25px;

padding: 12px;

width: 100%;

background: #2980b9;

color: white;

border: none;

font-size: 16px;

border-radius: 5px;

cursor: pointer;

}

button:hover {

background: #1f6391;

}

</style>

</head>

<body>

<div class="container">

<h2>👤 Individual Missing Person Report</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<label>First Name</label>
<input type="text" name="first_name" required>

<label>Last Name</label>
<input type="text" name="last_name" required>

<label>Father's Name</label>
<input type="text" name="father_name" required>

<label>Date of Birth (DOB)</label>
<input type="date" name="date_of_birth" required>

<label>Address</label>
<input type="text" name="address" required>

<label>Phone Number</label>
<input type="text" name="phone_number" required>

<label>Aadhaar Number</label>
<input type="text" name="aadhar_number" required>

<label>Missing From Date</label>
<input type="date" name="missing_from" required>

<label>Email Address</label>
<input type="email" name="email" required>

<label>Gender</label>
<select name="gender">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<label>Upload Person Image</label>
<input type="file" name="image" required>

<button type="submit">

Submit Individual Report

</button>

</form>

</div>

</body>

</html>
