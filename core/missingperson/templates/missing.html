<!DOCTYPE html>
<html>

<head>

<title>Missing Persons</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

/* Card styling */
.card {
    box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    border-radius: 10px;
    transition: 0.2s;
}

/* Hover effect (professional feel) */
.card:hover {
    transform: translateY(-5px);
}

/* Image styling */
.card img {
    height: 230px;
    object-fit: cover;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
}

/* Full width spacing */
.container-fluid {
    margin-top: 40px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-dark"
style="background-color:#37517E;">

<div class="container-fluid">

<a class="navbar-brand"
href="/">

<h3>TraceNEX</h3>

</a>

</div>

</nav>


<!-- Main Container -->

<div class="container-fluid px-4">

<h2 class="mb-4">Missing Persons</h2>

<div class="row">

{% for person in persons %}

<!-- 4 Cards Per Row -->

<div class="col-lg-3 col-md-6 col-sm-12 mb-4">

<div class="card">

<img src="{{ person.image.url }}"
class="card-img-top">

<div class="card-body">

<h5 class="card-title">
{{ person.first_name }}
{{ person.last_name }}
</h5>

<p>
<b>Phone:</b>
{{ person.phone_number }}
</p>

<p>
<b>Missing Date:</b>
{{ person.missing_from }}
</p>

<p>
<b>Report Type:</b>
{{ person.report_type }}
</p>

<a href="/delete/{{ person.id }}/"
class="btn btn-danger btn-sm">

Delete

</a>

<a href="/update/{{ person.id }}/"
class="btn btn-primary btn-sm">

Update

</a>

</div>

</div>

</div>

{% empty %}

<h4>No Missing Persons Found</h4>

{% endfor %}

</div>

</div>

</body>

</html>
